<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamanti Keyboard Design</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      margin-bottom: 2rem;
    }
    .logo {
      max-width: 320px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Diamanti Keyboard Design</h1>
    <img src="logo.png" alt="Diamanti Keyboard Design Logo" class="logo">
  </div>
</body>
</html>
